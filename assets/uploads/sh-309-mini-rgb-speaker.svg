<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">SH-309 Mini Wireless RGB Speaker</title>
  <desc id="desc">Mini portable wireless speaker with fabric body, colorful RGB night light, and outdoor sound system styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#dde7f5"/></linearGradient>
    <linearGradient id="speaker" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2a3445"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="mesh" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <linearGradient id="rgb" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff3b30"/><stop offset="0.18" stop-color="#ff9500"/><stop offset="0.36" stop-color="#ffcc00"/><stop offset="0.54" stop-color="#34c759"/><stop offset="0.72" stop-color="#007aff"/><stop offset="1" stop-color="#af52de"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#111827" flood-opacity="0.25"/></filter>
    <pattern id="fabric" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8h16M8 0v16" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/><path d="M0 0l16 16M16 0L0 16" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="720" fill="url(#bg)"/>
  <ellipse cx="450" cy="610" rx="260" ry="45" fill="#111827" opacity="0.14"/>
  <g filter="url(#shadow)">
    <rect x="245" y="120" width="410" height="430" rx="70" fill="url(#speaker)"/>
    <rect x="275" y="155" width="350" height="360" rx="48" fill="url(#mesh)"/>
    <rect x="275" y="155" width="350" height="360" rx="48" fill="url(#fabric)"/>
    <circle cx="450" cy="335" r="126" fill="#0f172a" stroke="url(#rgb)" stroke-width="18"/>
    <circle cx="450" cy="335" r="86" fill="#111827" stroke="#374151" stroke-width="12"/>
    <circle cx="450" cy="335" r="36" fill="#0b1120" stroke="#64748b" stroke-width="10"/>
    <path d="M326 113h248c16 0 28 12 28 28v30H298v-30c0-16 12-28 28-28z" fill="#111827"/>
    <rect x="362" y="82" width="176" height="48" rx="24" fill="#1f2937" stroke="#334155" stroke-width="8"/>
