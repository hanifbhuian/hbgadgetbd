    <circle cx="535" cy="208" r="12" fill="#ff3b30" opacity="0.95"/>
    <path d="M326 500h248" stroke="url(#rgb)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="450" y="660" font-size="40" font-weight="800" fill="#111827">SH-309 Mini RGB Speaker</text>
    <text x="450" y="695" font-size="24" font-weight="600" fill="#64748b">Wireless • Portable • Night Light</text>
