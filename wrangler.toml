# Generated by Wrangler on Sat Oct 17 2026 16:26:33 GMT-0600 (Mountain Daylight Time)
name = "hbgadgetbd"
pages_build_output_dir = "."
compatibility_date = "2026-07-03"

[env.production.vars]
HB_META_PAGE_ID = "1280860211779282"

[env.production.ai]
binding = "AI"

# Messenger conversation context: Cloudflare Workers KV Free tier.
# Stores only recent product IDs for 24 hours, never tokens or chat text.
[[env.production.kv_namespaces]]
binding = "HB_MESSENGER_CONTEXT"
id = "f8110ef1a2a0484eb74ba14f394c7e43"

# Privacy-limited store analytics (independent of Messenger AI KV).
[[env.production.analytics_engine_datasets]]
binding = "HB_STORE_ANALYTICS"
dataset = "hbgadgetbd_events"

# Cloudflare Analytics SQL read binding. Requires Wrangler >= 4.145.0.
[env.production.analytics]
binding = "HB_ANALYTICS_SQL"
